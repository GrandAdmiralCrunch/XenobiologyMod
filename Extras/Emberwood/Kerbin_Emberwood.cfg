// =====================================================================
//  KERBIN — the Emberwood: an autumn forest lair (XENO_LAIR kerbin_emberwood)
//  A generated forest (FOREST {}) around a site south-west of the space centre: six kinds of tree that
//  grow nowhere else, a spring with a little cascade, a stream down to a lily pond, a trail with a
//  wooden footbridge, and a clearing round an ancient copperoak. Four birds live only here.
//  Trees, ferns, shrubs and reeds are catalogued in the Field Guide (Observe beside the trail).
// =====================================================================

// ------------------------------------------------------------ plants: a new kingdom in the tree of life
