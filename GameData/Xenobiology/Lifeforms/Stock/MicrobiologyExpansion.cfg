    rank = Kingdom
    era = surviving today
    revealThreshold = 2
    color = 0.7,0.4,0.3,1
    microbeCategories = Bacteria, Archaea, Protist, Fungi, Parasite
    description = Duna's biosphere is not quite dead. In polar ice, canyon brines and lichen crusts, the descendants of the Archaeodunota hang on as microbes.
}

