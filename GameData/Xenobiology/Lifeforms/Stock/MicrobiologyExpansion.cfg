// =====================================================================
//  MICROBIOLOGY EXPANSION COMPATIBILITY
//  Microbes defined by MicrobiologyExpansion (MICROBE nodes) become leaves on the
//  Xenobiology trees of life. A discovered microbe is +1 evidence for its clade (and every
//  clade above it); lab-processing it in the MPL adds +1 more.
//
//  How a microbe finds its place:
//    1. XENO_CLADE { microbes = Exact Name, Other Name }        explicit placement
//    2. XENO_CLADE { microbeCategories = Bacteria, Archaea }    the deepest matching clade of
//                                                               the microbe's home world wins
//    3. XENO_BIOSPHERE { microbeClade = some_clade }            catch-all for the rest
//  Debris and abiotic "Unknown" entries are never placed unless listed explicitly.
//  XENO_PANSPERMIA { microbeEvidence = A, B } counts discovered microbes towards an event.
//
//  Everything here is guarded by :NEEDS[MicrobiologyExpansion], so without that mod the
//  trees look exactly as before. Keys on existing nodes are harmless either way.
// =====================================================================

// ---------------------------------------------------------------- Kerbin
XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = kerbin_microbiota
    parent = kerbin_protobiota
    biosphere = kerbin_biosphere
    displayName = Microkerbota
    rank = Kingdom
    era = ~3.6 billion years ago
    revealThreshold = 3
    color = 0.3,0.5,0.55,1
    microbeCategories = Bacteria, Archaea, Symbiote
    description = Kerbin's single-celled majority: the bacteria and archaea that run its chemistry. Their oldest lines carry Dunan genes.
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = kerbin_parasitica
    parent = kerbin_microbiota
    biosphere = kerbin_biosphere
    displayName = Parasitica
    rank = Clade
    era = ~2 billion years ago
    revealThreshold = 2
    color = 0.5,0.25,0.3,1
    microbeCategories = Parasite, Virus
    description = Lineages that gave up living alone: parasites, and the viral passengers that ride every cell on Kerbin.
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = kerbin_protista
    parent = kerbin_protobiota
    biosphere = kerbin_biosphere
    displayName = Protokerbista
    rank = Kingdom
    era = ~2 billion years ago
    revealThreshold = 2
    color = 0.35,0.55,0.35,1
    microbeCategories = Protist
    description = Complex single cells - diatoms, flagellates and grazers - the first Kerbin organisms with a nucleus.
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = kerbin_mycota
    parent = kerbin_protobiota
    biosphere = kerbin_biosphere
    displayName = Kerbomycota
    rank = Kingdom
    era = ~1.2 billion years ago
    revealThreshold = 2
    color = 0.55,0.5,0.3,1
    microbeCategories = Fungi
    description = Kerbin's fungi, from the mycorrhizal webs under the grasslands to the cold-tolerant spores of the ice caps.
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = kerbin_meiofauna
    parent = kerbin_protobiota
    biosphere = kerbin_biosphere
    displayName = Meiokerba
    rank = Clade
    era = ~700 million years ago
    revealThreshold = 2
    color = 0.55,0.45,0.4,1
    microbeCategories = Metazoa
    description = Microscopic animals: bristleworms, moss animals and the nearly indestructible tardigrades.
}

@XENO_BIOSPHERE[kerbin_biosphere]:NEEDS[MicrobiologyExpansion]
{
    %microbeClade = kerbin_microbiota
}

