// ---------------------------------------------------------------- Jool: spores in the clouds
// The biosphere itself (and its animals) lives in Jool.cfg; this adds the native microbial domain.
@XENO_BIOSPHERE[jool_aerobiosphere]:NEEDS[MicrobiologyExpansion]
{
    %microbeClade = jool_aerospora
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = jool_aerospora
    parent = jool_life
    biosphere = jool_aerobiosphere
    displayName = Aerospora
    rank = Domain
    era = ~2 billion years ago
    revealThreshold = 2
    color = 0.45,0.6,0.3,1
    microbeCategories = Bacteria, Protist, Fungi, Archaea
    description = Lifelong floaters in Jool's cloud decks. Their spores are light enough to be lifted out of the atmosphere entirely - and Laythe orbits right through the plume.
}

XENO_PANSPERMIA:NEEDS[MicrobiologyExpansion]
{
    name = pan_sporerain
    displayName = The Spore Rain
    sourceClade = jool_aerospora
    targetBiosphere = laythe_biosphere
    targetClade = laythe_mycota
    microbeEvidence = Methanoxus Sporum, Sporothrix Laythensis, Fossilized Fungal Fragment
    mechanism = Atmospheric spore escape (Jool to Laythe)
    age = ~1.6 billion years ago
    revealThreshold = 4
    description = Storms in Jool's upper atmosphere fling fungal spores clear of the planet. Laythe, orbiting inside Jool's magnetosphere, sweeps them up. Long before the Seaborne Crossing, a few landed in its warm volcanic shallows and became the Laythean Mycota - the reason Laythe's corals, seamats and puffballs share nothing with its animals.
}

@XENO_FOSSIL[laythe_sporeash]:NEEDS[MicrobiologyExpansion]
{
    @evidenceFor = laythe_mycota, pan_sporerain
}
