// =====================================================================
//  JOOL - life with no ground at all.
//  Jool has no terrain, so Air species' minAltitude / maxAltitude are absolute (metres
//  above Jool's datum) and creatures only appear around vessels flying inside that band.
//  Its animals came from Laythe ("The Skyward Fall", Panspermia.cfg). With Microbiology
//  Expansion, Jool's native spores join the tree too (MicrobiologyExpansion.cfg).
// =====================================================================

XENO_BIOSPHERE
{
    name = jool_aerobiosphere
    body = Jool
    displayName = Joolian Skies
    rootClade = jool_life
    spawnDensity = 0.5
    description = No surface, no ocean - and yet things live in Jool's upper cloud decks, between about 120 and 175 km up. Fly something slow through that band and watch the green haze: rafts of bloated gas-bags drift there, each carrying a buzzing colony on its back.
}

XENO_CLADE
{
    name = jool_life
    biosphere = jool_aerobiosphere
    displayName = Joolian Life
    rank = Biosphere
    grouping = true
    revealThreshold = 1
    color = 0.5,0.62,0.3,1
    description = Everything alive in Jool's skies. Not one family tree: the animals arrived from somewhere else.
}

XENO_CLADE
{
    name = jool_anabiota
    parent = jool_life
    biosphere = jool_aerobiosphere
    displayName = Anabiota
    rank = Domain
    era = ~300 million years ago
    revealThreshold = 2
    color = 0.62,0.68,0.35,1
    description = "The ones that went up". Every animal in Jool's sky shares this ancestor, and its genome sits inside Laythe's Neothalassobiota: the gas-bags are close kin of Laythe's SkyReefs, and the insects that ride them of Laythe's raptopods.
}

XENO_CLADE
{
    name = jool_physalida
    parent = jool_anabiota
    biosphere = jool_aerobiosphere
    displayName = Physalida
    rank = Class
    era = ~250 million years ago
    revealThreshold = 1
    color = 0.6,0.68,0.35,1
    description = Bloated gas-bag drifters. Like Laythe's Aeromedusae they breathe through rimmed spiracles and fish the air with beaded tendrils, but in Jool's deep, dense sky there was no need for a long airship hull. They grew round instead.
}

XENO_CLADE
{
    name = jool_nidopoda
    parent = jool_anabiota
    biosphere = jool_aerobiosphere
    displayName = Nidopoda
    rank = Class
    era = ~250 million years ago
    revealThreshold = 1
    color = 0.8,0.7,0.25,1
    description = "Nest-feet". Four-winged insects that never land on anything but a gas-bag. They nest in the papery cells of a bloatfloater's crown, eat the spores and mites that collect there, and keep its spiracles clean. The bargain has a price: every so often one blunders into the tendrils and is eaten.
}

