    description = A swollen, lumpy gas-bag forty-five metres across, olive-green and veined, drifting through Jool's upper cloud decks. Rimmed spiracles ring its crown, and a ring of beaded, sticky tendrils sixty metres long hangs splayed beneath it, catching spores - and anything else that touches them. Its crown is covered in papery nest cells, home to a colony of crestflies. Its veins, spiracles and tendrils mark it unmistakably as a cousin of Laythe's SkyReefs.
