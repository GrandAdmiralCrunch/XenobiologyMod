// =====================================================================
//  EVE — a true second genesis. No panspermia link: its life arose
//  independently, which is why its biology looks nothing like Kerbin's.
// =====================================================================

XENO_BIOSPHERE
{
    name = eve_biosphere
    body = Eve
    displayName = Evean Biosphere
    rootClade = eve_biota
    spawnDensity = 0.6
    description = Under crushing pressure and purple skies, a completely alien biochemistry thrives. Nothing here shares an ancestor with anything else in the Kerbol system.
}

XENO_CLADE
{
    name = eve_biota
    biosphere = eve_biosphere
    displayName = Deuterogenesis
    rank = Domain
    era = ~2.4 billion years ago
    revealThreshold = 3
    color = 0.55,0.3,0.6,1
    description = "Second genesis". Evean life uses a different set of building blocks entirely, proving that life began at least twice in the Kerbol system.
}

XENO_CLADE
{
    name = eve_aerostata
