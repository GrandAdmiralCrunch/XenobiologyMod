// =====================================================================
//  DUNA — an extinct biosphere, known only from fossils.
//  Example of `extinct = true`: nothing spawns alive, but the tree of life
//  can still be reconstructed, and it holds the key to Kerbin's origins.
// =====================================================================

XENO_BIOSPHERE
{
    name = duna_biosphere
    body = Duna
    displayName = Ancient Dunan Biosphere
    rootClade = duna_archaeobiota
    extinct = true
    description = Billions of years ago Duna had seas, a thick atmosphere and life. All that remains are the stones it left behind.
}

XENO_CLADE
{
    name = duna_archaeobiota
    biosphere = duna_biosphere
    displayName = Archaeodunota
    rank = Domain
    era = ~4.1 – 2.9 billion years ago
    revealThreshold = 2
    color = 0.7,0.4,0.3,1
    description = The first and only domain of Dunan life. Its left-handed sugar chemistry matches Kerbin's oldest microbes exactly.
}

XENO_CLADE
{
    name = duna_stromatoformes
    parent = duna_archaeobiota
    biosphere = duna_biosphere
    displayName = Stromatoformes
    rank = Kingdom
    era = ~4.0 billion years ago
    revealThreshold = 1
    color = 0.75,0.5,0.35,1
    description = Mat-building microbes that layered vast reefs along Duna's long-vanished shorelines. Large impacts would have flung fragments of these mats into space.
}

XENO_CLADE
{
    name = duna_conchifera
    parent = duna_archaeobiota
    biosphere = duna_biosphere
    displayName = Rubriconchia
    rank = Kingdom
    era = ~3.2 billion years ago
    revealThreshold = 1
    color = 0.8,0.45,0.4,1
    description = Shelled swimmers of Duna's last seas - the most complex life Duna ever produced, before its atmosphere bled away.
}

