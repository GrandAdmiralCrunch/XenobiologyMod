// =====================================================================
//  KERBIN — native biosphere (example content, also a template for modders)
//  Life on Kerbin is ancient and diverse. Its very oldest roots, however,
//  hide a secret that only Duna's fossils can explain...
// =====================================================================

XENO_BIOSPHERE
{
    name = kerbin_biosphere
    body = Kerbin
    displayName = Kerbin Biosphere
    rootClade = kerbin_protobiota
    spawnDensity = 1.0
    description = The home world teems with life, yet surprisingly little of it has ever been formally described. Kerbal science has been rather focused on rockets.
}

// ------------------------------------------------------------ clades
XENO_CLADE
{
    name = kerbin_protobiota
    biosphere = kerbin_biosphere
    displayName = Protokerbota
    rank = Domain
    era = ~3.6 billion years ago
    revealThreshold = 3
    color = 0.45,0.65,0.45,1
    description = The last common ancestor of all Kerbin life: a hardy, mat-forming microbe. Its unusual left-handed sugar chemistry is shared by no other known Kerbin process - a clue that it may not have originated here at all.
}

XENO_CLADE
{
    name = kerbin_quadrimembra
    parent = kerbin_protobiota
    biosphere = kerbin_biosphere
    displayName = Quadrimembra
    rank = Clade
    era = ~420 million years ago
    revealThreshold = 2
    color = 0.55,0.6,0.35,1
    description = Four-limbed land animals, descended from lobe-finned sea creatures that hauled themselves onto Kerbin's shores. Kerbals themselves are (somewhat embarrassingly) members.
}

XENO_CLADE
{
    name = kerbin_aerokerba
    parent = kerbin_quadrimembra
    biosphere = kerbin_biosphere
    displayName = Aerokerba
    rank = Order
    era = ~150 million years ago
    revealThreshold = 2
    color = 0.5,0.6,0.75,1
    description = Quadrimembrans whose forelimbs became wings. Lightweight hollow bones and a fondness for updrafts.
}

XENO_CLADE
{
    name = kerbin_patagiata
    parent = kerbin_quadrimembra
    biosphere = kerbin_biosphere
    displayName = Patagiata
    rank = Order
    era = ~110 million years ago
    revealThreshold = 2
    color = 0.25,0.55,0.55,1
    description = Rib-gliders. Quadrimembrans whose flank ribs grew long and mobile and now carry a gliding membrane, the patagium. They fold it flat to walk and spread it to ride mountain updrafts. Kerbin's other fliers, the Aerokerba, evolved flight separately, using their forelimbs.
}

XENO_CLADE
{
    name = kerbin_longiformes
    parent = kerbin_quadrimembra
    biosphere = kerbin_biosphere
    displayName = Longiformes
    rank = Order
    era = ~90 million years ago
    revealThreshold = 1
    color = 0.6,0.55,0.3,1
    description = A lineage that gave its legs back. Vestigial hip bones betray their four-limbed ancestry.
}

XENO_CLADE
{
    name = kerbin_hexapodia
    parent = kerbin_protobiota
    biosphere = kerbin_biosphere
    displayName = Hexapodia
    rank = Phylum
    era = ~480 million years ago
    revealThreshold = 2
    color = 0.7,0.5,0.3,1
    description = Six-legged, armoured invertebrates. Small, numerous and extraordinarily good at hiding under rocks when a kerbal approaches.
}

XENO_CLADE
{
    name = kerbin_hexathera
    parent = kerbin_hexapodia
    biosphere = kerbin_biosphere
    displayName = Hexathera
    rank = Class
    era = ~250 million years ago
    revealThreshold = 1
    color = 0.6,0.62,0.7,1
    description = The warm-blooded hexapods. One lineage of armoured six-legged crawlers swapped its shell for fur and became Kerbin's answer to the bear. They are still six-legged, and their alternating tripod gait gives away their ancestry.
}

XENO_CLADE
{
    name = kerbin_pterohexa
    parent = kerbin_hexapodia
    biosphere = kerbin_biosphere
    displayName = Pterohexapoda
    rank = Class
    era = ~350 million years ago
    revealThreshold = 2
    color = 0.55,0.7,0.45,1
    description = The winged hexapods - Kerbin's insects. Their wings are not limbs but flaps of shell that grew out from the back, so they kept all six legs. Most of Kerbin's small, buzzing, crawling life belongs here.
}

XENO_CLADE
{
    name = kerbin_elytrophora
    parent = kerbin_pterohexa
    biosphere = kerbin_biosphere
    displayName = Elytrophora
    rank = Order
    era = ~240 million years ago
    revealThreshold = 1
    color = 0.3,0.35,0.3,1
    description = "Sheath-bearers". Insects whose front wings hardened into armoured cases over the flying pair. Slow, heavy and very hard to crush.
}

XENO_CLADE
{
    name = kerbin_chiroptera
    parent = kerbin_aerokerba
    biosphere = kerbin_biosphere
    displayName = Tetrapterygia
    rank = Family
    era = ~40 million years ago
    revealThreshold = 1
    color = 0.7,0.45,0.3,1
    description = "Four-wings". Night-flying aerokerbans that grew a second set of membranes between their hind legs and tail. They are noisy, nosy and fiercely protective of their desert roosts.
}

XENO_CLADE
{
    name = kerbin_thalassobiota
    parent = kerbin_protobiota
    biosphere = kerbin_biosphere
    displayName = Thalassobiota
    rank = Kingdom
    era = ~1.1 billion years ago
    revealThreshold = 2
    color = 0.3,0.55,0.7,1
    description = The great marine radiation. Nearly every animal on Kerbin descends from these sea-dwellers - and, it would later turn out, so does everything on Laythe.
}

XENO_CLADE
{
    name = kerbin_pinnata
    parent = kerbin_thalassobiota
    biosphere = kerbin_biosphere
    displayName = Pinnata
    rank = Phylum
    era = ~520 million years ago
    revealThreshold = 1
    color = 0.35,0.6,0.8,1
    description = Finned swimmers with an internal skeleton.
}

XENO_CLADE
{
    name = kerbin_medusoida
    parent = kerbin_thalassobiota
    biosphere = kerbin_biosphere
    displayName = Medusoida
    rank = Phylum
    era = ~700 million years ago
    revealThreshold = 2
    color = 0.55,0.4,0.75,1
    description = Soft-bodied bell-shaped drifters. One branch filled its bell with lighter-than-air gas and took to the skies of the polar tundra.
}

