// =====================================================================
//  PANSPERMIA EVENTS
//  Link a clade in one biosphere to the root of another. Revealed when
//  evidence >= revealThreshold, where evidence = fossil points (fossils with
//  evidenceFor = <this name>) + 1 if the source clade is resolved
//  + 1 if the target biosphere's root clade is resolved.
//  Chain in the stock example:   Duna  ──▶  Kerbin  ──▶  Laythe animals  ──▶  Jool's sky animals      (Eve: independent)
//  targetClade (optional) names the lineage that was seeded; default = the target biosphere's root.
//  With Microbiology Expansion:  Jool spores ──▶ Laythe fungi  (see MicrobiologyExpansion.cfg)
// =====================================================================

XENO_PANSPERMIA
{
    name = pan_red_seed
    displayName = The Red Seed
    sourceClade = duna_stromatoformes
    targetBiosphere = kerbin_biosphere
    mechanism = Impact ejecta (Duna to Kerbin)
    age = ~3.7 billion years ago
    revealThreshold = 4
    description = A giant impact on young Duna blasted microbial mats into space. A few survived the journey inward and landed in Kerbin's shallow seas. Every kerbal who has ever lived is, in a sense, a Dunan.
}

XENO_PANSPERMIA
{
    name = pan_seaborne
    displayName = The Seaborne Crossing
    sourceClade = kerbin_thalassobiota
    targetBiosphere = laythe_biosphere
    targetClade = laythe_neothalassobiota
    mechanism = Cometary impact ejecta (Kerbin to Laythe)
    age = ~1.0 billion years ago
    revealThreshold = 3
    description = A comet strike in Kerbin's ocean threw frozen seawater - and the marine organisms in it - into interplanetary space. Some fell into Jool's system and seeded Laythe's empty ocean.
}

XENO_PANSPERMIA
{
    name = pan_skyward
    displayName = The Skyward Fall
    sourceClade = laythe_neothalassobiota
    targetBiosphere = jool_aerobiosphere
    targetClade = jool_anabiota
    mechanism = Impact ejecta (Laythe to Jool)
    age = ~300 million years ago
    revealThreshold = 2
    description = An asteroid strike on Laythe's ocean threw spray, spores and living things into space, and Laythe sits deep in Jool's gravity well. Most of it fell into Jool and burned. But a few young SkyReef-kin, with raptopod hitch-hikers already nesting on them, drifted down into the upper cloud decks. They found air thick enough to float in forever and no ground to fall to. The Bloatfloaters and their Crestflies are their descendants - and the reason Jool's sky animals share their genes with Laythe's.
}
