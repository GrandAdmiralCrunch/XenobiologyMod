// =====================================================================
//  MICROBIAL WORLDS: Mun, Minmus, Dres, Eeloo and Tylo
//  These bodies have no animals, only the microbes MicrobiologyExpansion adds. Each gets a
//  small tree of life so those microbes appear in the Field Guide and count as evidence.
//  Everything here needs MicrobiologyExpansion. Without it, none of these biospheres exist.
// =====================================================================

// ---------------------------------------------------------------- Mun
XENO_BIOSPHERE:NEEDS[MicrobiologyExpansion]
{
    name = mun_biosphere
    body = Mun
    displayName = Munar Endoliths
    rootClade = mun_endolithota
    microbeClade = mun_endolithota
    description = The Mun is airless, frozen at night and scorched by day. A few millimetres inside its rocks, out of the radiation, something is still alive - and its genes say it came from Kerbin.
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = mun_endolithota
    biosphere = mun_biosphere
    displayName = Endolithota
    rank = Domain
    era = ~2.5 billion years ago
    revealThreshold = 1
    color = 0.55,0.55,0.58,1
    microbeCategories = Bacteria, Archaea, Fungi, Protist
    description = Rock-dwelling microbes that grow slower than anything on Kerbin. Their ancestors were Kerbin archaea, thrown up to the Mun on impact debris.
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = mun_lithotrophica
    parent = mun_endolithota
    biosphere = mun_biosphere
    displayName = Lithotrophica
    rank = Clade
    era = ~2 billion years ago
    revealThreshold = 1
    color = 0.62,0.6,0.55,1
    microbes = Lithotroph Münis
    description = Rock eaters. They take what they need from the minerals around them and divide perhaps once a decade.
}

// ---------------------------------------------------------------- Minmus
XENO_BIOSPHERE:NEEDS[MicrobiologyExpansion]
{
    name = minmus_biosphere
    body = Minmus
    displayName = Minmus Flats Biota
    rootClade = minmus_vitrobiota
    microbeClade = minmus_vitrobiota
    description = Minmus was not born near Kerbin; it was captured. The hardy cells sealed in its salt and ice flats came with it, from wherever it formed.
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = minmus_vitrobiota
    biosphere = minmus_biosphere
    displayName = Vitrobiota
    rank = Domain
    era = unknown, older than its capture
    revealThreshold = 1
    color = 0.6,0.85,0.75,1
    microbeCategories = Bacteria, Archaea, Fungi, Protist
    description = Microbes that survive between thaws by turning their cell contents into a sugary glass. They are related to nothing on Kerbin.
}

// ---------------------------------------------------------------- Dres
XENO_BIOSPHERE:NEEDS[MicrobiologyExpansion]
{
    name = dres_biosphere
    body = Dres
    displayName = Dresian Canyon Biota
    rootClade = dres_halobiota
    microbeClade = dres_halobiota
    description = Dres' deep canyons hold old salt and glassy impact ejecta. Two very different lines of life have made a home in them.
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = dres_halobiota
    biosphere = dres_biosphere
    displayName = Halodresiota
    rank = Domain
    era = ~3 billion years ago
    revealThreshold = 1
    color = 0.85,0.6,0.65,1
    microbeCategories = Archaea, Fungi, Protist
    description = Salt-lovers. Their pink pigment tints the canyon walls rose where colonies are thick.
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = dres_silicobiota
    parent = dres_halobiota
    biosphere = dres_biosphere
    displayName = Silicodresia
    rank = Kingdom
    era = ~1.5 billion years ago
    revealThreshold = 1
    color = 0.7,0.75,0.85,1
    microbes = Lithosilicus Dresii
    microbeCategories = Bacteria
    description = Bacteria that build their cell walls partly from glass. They spread into the impact ejecta after the great Dres impact and now grow there like slow crystals.
}

// ---------------------------------------------------------------- Eeloo
XENO_BIOSPHERE:NEEDS[MicrobiologyExpansion]
{
    name = eeloo_biosphere
    body = Eeloo
    displayName = Eeloo Tholin Biota
    rootClade = eeloo_cryobiota
    microbeClade = eeloo_cryobiota
    description = At the edge of the system, in ice canyons stained red with tholins, a few cells divide about once a century.
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = eeloo_cryobiota
    biosphere = eeloo_biosphere
    displayName = Cryobiota
    rank = Domain
    era = ~4 billion years ago
    revealThreshold = 1
    color = 0.75,0.55,0.5,1
    microbeCategories = Bacteria, Archaea, Fungi, Protist
    description = Cold-adapted microbes that feed on the organic tholins coating Eeloo's ice. They may be the oldest unbroken lineage in the system.
}

// ---------------------------------------------------------------- Tylo
XENO_BIOSPHERE:NEEDS[MicrobiologyExpansion]
{
    name = tylo_biosphere
    body = Tylo
    displayName = Grissom Crater Biota
    rootClade = tylo_chlorobiota
    microbeClade = tylo_chlorobiota
    description = Life on Tylo is confined to the brines of Grissom Crater, and it is not friendly: it breathes out chlorine.
}

XENO_CLADE:NEEDS[MicrobiologyExpansion]
{
    name = tylo_chlorobiota
    biosphere = tylo_biosphere
    displayName = Chlorobiota
    rank = Domain
    era = ~2 billion years ago
    revealThreshold = 1
    color = 0.7,0.8,0.35,1
    microbeCategories = Bacteria, Archaea, Fungi, Protist, Parasite
    description = Extreme salt-lovers that release chlorine as waste. Handle every sample as a hazard.
}

// ---------------------------------------------------------------- Crossings
XENO_PANSPERMIA:NEEDS[MicrobiologyExpansion]
{
    name = pan_munar_splash
    displayName = The Munar Splash
    sourceClade = kerbin_microbiota
    targetBiosphere = mun_biosphere
    targetClade = mun_endolithota
    mechanism = Impact ejecta (Kerbin to Mun)
    age = ~2.5 billion years ago
    revealThreshold = 2
    microbeEvidence = Lithotroph Münis
    description = A large impact on young Kerbin threw rock - and the microbes living in it - up out of the atmosphere. The Mun is close, and some of that rock landed there. Most of the cells died. A few kept going inside the stone.
}

XENO_PANSPERMIA:NEEDS[MicrobiologyExpansion]
{
    name = pan_tylo_fall
    displayName = The Chlorine Rain
    sourceClade = tylo_chlorobiota
    targetBiosphere = jool_aerobiosphere
    mechanism = Impact ejecta (Tylo to Jool)
    age = ongoing
    revealThreshold = 2
    microbeEvidence = Chlorinivorax Tyloii, Joolmoeba
    description = Impacts on Tylo still knock chlorine-breathing cells into orbit, and Jool's gravity pulls many of them into its clouds. None have taken hold there: the giant Joolmoeba eats them. This is a crossing that keeps happening and keeps failing.
}
