// =====================================================================
//  LAYTHE — an ocean moon with TWO unrelated lineages of life.
//   * Neothalassobiota: animals descended from Kerbin's Thalassobiota, carried
//     here by cometary ejecta ~1 billion years ago (pan_seaborne).
//   * Laythean Mycota: an older fungal kingdom. With Microbiology Expansion
//     installed its origin is traced to spores raining down from Jool's upper
//     atmosphere (pan_sporerain, in MicrobiologyExpansion.cfg).
//  The root "Laythean Life" is a grouping, not a clade: the two never shared
//  an ancestor, and the field guide draws them joined by dotted lines.
// =====================================================================

XENO_BIOSPHERE
{
    name = laythe_biosphere
    body = Laythe
    displayName = Laythean Biosphere
    rootClade = laythe_life
    spawnDensity = 0.9
    description = A cold ocean world with island chains, black dunes, steaming peaks and glowing shallows. Two kinds of life share it: animals that feel strangely familiar to anyone who has stood on a Kerbin beach, and a fungal kingdom that was here first.
}

