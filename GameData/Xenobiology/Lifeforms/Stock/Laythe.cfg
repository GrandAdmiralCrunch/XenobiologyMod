//  (hand-written; kept outside the generated LAYTHE EXPANSION section)
//  Grubs live in clusters on the sea floor. Watched long enough, one swells with gas,
//  floats up and becomes a pupa at the surface, which climbs into the sky over a couple
//  of days. The adult is spawned kilometres out (spawnDistance) so it is seen coming.
// =====================================================================

