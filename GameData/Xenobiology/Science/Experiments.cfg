// Experiment definitions used for Xenobiology science. Subjects are created per species /
// fossil type and per biome, so every new organism is worth science of its own.
// situationMask / biomeMask: SrfLanded=1 SrfSplashed=2 FlyingLow=4 FlyingHigh=8 InSpaceLow=16 InSpaceHigh=32

EXPERIMENT_DEFINITION
{
    id = xenoObservation
    title = Xenobiological Observation
    baseValue = 10
    scienceCap = 10
    dataScale = 1
    requireAtmosphere = False
    situationMask = 7
    biomeMask = 7
    RESULTS
    {
        default = Detailed field notes and sketches of a living alien organism.
        default = The kerbal's notebook is full of excited drawings, most of them accurate.
        default = Behaviour, gait and feeding habits carefully logged.
    }
}

EXPERIMENT_DEFINITION
{
    id = xenoFossilStudy
    title = Palaeontological Survey
    baseValue = 15
    scienceCap = 15
    dataScale = 1
    requireAtmosphere = False
    situationMask = 3
    biomeMask = 3
    RESULTS
    {
        default = Measurements, rubbings and stratigraphic context of an ancient specimen.
        default = The scientist insists this rock is "extremely significant". Probably true.
    }
}

EXPERIMENT_DEFINITION
{
    id = xenoLairSurvey
    title = Lair Survey
    baseValue = 40
    scienceCap = 40
    dataScale = 1
    requireAtmosphere = False
    situationMask = 3
    biomeMask = 0
    RESULTS
    {
        default = Floor plans, bone counts and a very quick sketch of the sleeping occupant.
        default = The notes end abruptly with the word "RUN".
    }
}

EXPERIMENT_DEFINITION
{
    id = xenoTelephoto
    title = Wildlife Photography
    baseValue = 6
    scienceCap = 6
    dataScale = 1
    requireAtmosphere = False
    situationMask = 15
    biomeMask = 15
    RESULTS
    {
        default = A sharp telephoto sequence of an alien animal going about its day.
        default = Mostly blurry, but frame 214 is going on the wall at mission control.
    }
}

EXPERIMENT_DEFINITION
{
    id = xenoHydrophone
    title = Hydroacoustic Recording
    baseValue = 5
    scienceCap = 5
    dataScale = 1
    requireAtmosphere = False
    situationMask = 2
    biomeMask = 2
    RESULTS
    {
        default = Hours of clicks, moans and pulses from something swimming out of sight.
        default = Spectrograms of an underwater call nobody has heard before.
    }
}

// Value is set per specimen by ModuleXenoContainment (scienceValue x liveMultiplier / deadMultiplier);
// the cap here only matters if the subject has to be rebuilt during recovery, so it is generous.
EXPERIMENT_DEFINITION
{
    id = xenoSpecimen
    title = Live Specimen
    baseValue = 30
    scienceCap = 200
    dataScale = 1
    requireAtmosphere = False
    situationMask = 63
    biomeMask = 3
    RESULTS
    {
        default = A living alien organism, delivered to the R&D labs in one piece.
    }
}

// Every EVA kerbal gets the field kit (observe lifeforms, study fossils).
@PART[kerbalEVA*]:HAS[@MODULE[KerbalEVA]]:FOR[Xenobiology]
{
    MODULE
    {
        name = ModuleXenoFieldKit
    }
}

EXPERIMENT_DEFINITION
{
    id = xenoAnalysis
    title = Xenobiology Lab Analysis
    baseValue = 30
    scienceCap = 300
    dataScale = 1
    requireAtmosphere = False
    situationMask = 63
    biomeMask = 0
    RESULTS
    {
        default = Tissue sequenced, isotopes dated, and a new branch pencilled onto the tree of life.
        default = The lab smells strange for a week, but the results are worth it.
    }
}
