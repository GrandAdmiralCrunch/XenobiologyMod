// Every science lab (stock Mobile Processing Lab and any mod lab with ModuleScienceLab) gets a
// Xenobiology analysis bench: scientists aboard can analyse CO-Z specimens and fossil samples.
@PART[*]:HAS[@MODULE[ModuleScienceLab],!MODULE[ModuleXenoAnalysis]]:FOR[Xenobiology]
{
    MODULE
    {
        name = ModuleXenoAnalysis
        hoursPerItem = 3
        ecPerSecond = 1.5
        specimenMultiplier = 2
        fossilMultiplier = 2
    }
}
