// =====================================================================
//  XENOBIOLOGY — global settings
//  Override from your own mod with ModuleManager, e.g.
//    @XENOBIOLOGY_SETTINGS:FINAL { @maxActiveCreatures = 20 }
// =====================================================================
XENOBIOLOGY_SETTINGS
{
    // ---- living population around the active vessel
    maxActiveCreatures   = 30     // cap on simultaneously simulated creatures (herds and schools count 1/4 per animal)
    maxCreatureObjects   = 60     // hard limit on creature objects of any kind
    densityMultiplier    = 1.0    // global multiplier on every biosphere's spawnDensity
    spawnRadius          = 1200   // metres: creatures appear inside this radius...
    minSpawnDistance     = 150    // ...but never closer than this (no pop-in in your face)
    despawnRadius        = 2000   // metres: creatures beyond this are removed
    maxObserverAltitude  = 4000   // metres above terrain; higher than this nothing is simulated
    spawnCheckInterval   = 1.5    // seconds between population updates
    territoryCellKm      = 3      // size of a "territory" — each cell hosts a stable mix of species

    // ---- fossils
    maxFossilSites       = 6
    fossilSpawnRadius    = 900
    fossilDensity        = 1.0

    // ---- interaction
    defaultObserveRange  = 40     // metres, used when a species doesn't set observeRange
    fossilStudyRange     = 6      // metres from the outcrop a kerbal must stay while studying
    observeKey           = O      // EVA shortcut for "Observe Lifeform" (None to disable)
    fieldGuideKey        = None   // optional hotkey to toggle the field guide
    debugKey             = F8     // Alt + this key opens the debug window
    mountKey             = Y      // mount / dismount a rideable creature (it must be asleep)
    rideAttackKey        = T      // while riding: the mount's attack (e.g. tail swing)
    requireRecoveryForScience = true   // false = observations award science instantly

    // ---- field guide
    spoilerFree                 = true   // only list biospheres where you've found something
    showUndiscoveredSilhouettes = true   // Pokédex-style dark silhouettes for unseen species

    // Megafauna
    projectileDamage = true      // boulders thrown by giants can break parts and hurt kerbals (false = they only shove)
    lairWaypoints = true         // put a waypoint on lairs once discovered

    // ---- performance (creature level of detail by distance from the camera)
    lodEnabled      = true
    lodNearDistance = 150    // + 10 m per metre of size: full detail (shadows, every-frame ground contact)
    lodFarDistance  = 450    // + 25 m per metre of size: beyond this, AI and motion update every 3rd frame
    lodCullDistance = 150    // + lodCullPerMetre per metre of size: beyond this a creature is hidden and barely simulated
    lodCullPerMetre = 120    //   (a 1 m butterfly vanishes at 270 m, a 3 m bison at 510 m, a 40 m giant at 4.9 km)
    creatureShadows = true   // near creatures cast shadows...
    shadowMinSize   = 1.2    // ...if they are at least this long
    lairLightRange  = 250    // lair lights only switch on within this distance

    // ---- diving
    kerbalDiving = true      // EVA kerbals can dive: hold jetpack-down (LCtrl) to sink, jetpack-up (LShift) to rise

    debugMode = false
}
